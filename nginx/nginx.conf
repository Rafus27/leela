events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Маппинг для корректной работы WebSocket handshake
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend_server {
        server backend:3000;
    }

    # 1. HTTP — перенаправление на HTTPS и проверка Certbot
    server {
        listen 80;
        server_name example.com example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS — основной сервер
    
    # server {
    #     listen 443 ssl;
    #     server_name example.com example.com;

    #     # Пути к сертификатам Let's Encrypt
    #     ssl_certificate /etc/letsencrypt/live/example.com;
    #     ssl_certificate_key /etc/letsencrypt/live/example.com;

    #     # Оптимизация SSL
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;

    #     # Статический фронтенд
    #     location / {
    #         root /usr/share/nginx/html;
    #         index index.html;
    #         try_files $uri $uri/ /index.html;
    #     }

        # API и WebSocket (проксирование на Node.js)
        location /api/ {
            proxy_pass http://backend_server;
            
            # Настройки WebSocket и HTTP/1.1
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Передача реальных IP адресов
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты для WebSocket (чтобы соединение не обрывалось быстро)
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
