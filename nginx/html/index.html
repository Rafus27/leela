<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Lila</title>
</head>

<body>

    <div class="menu active" id="menu">
        <img src="media/background.webp" alt="LILA">
        <div class="container">
            <button disabled id="single">Одиночная игра</button>
            <button id="admin">Создать игру</button>
            <button id="reconnect">Переподключиться</button>
            <input id="key" type="text" placeholder="Ключ">
            <input id="name" type="text" placeholder="Имя">
            <input id="color" type="color" placeholder="Цвет">
            <button id="join">Присоединиться</button>
            <button id="back">Назад</button>
            <div id="keyholder">!@#$</div>
        </div>
        <img src="media/background2.webp" alt="Kurbeyeva Victoriya">
    </div>

    <div id="game" class="game">
        <div id="field" class="field"></div>

        <div class="container">
            <div id="player-list" class="player-list">

            </div>
            <div class="controller">
                <button id="menu-btn">Меню</button>
                <button disabled style="width: 100%; margin-left: 20px;" id="roll">Бросок</button>
            </div>
            <img id="logo" src="media/background2.webp" alt="Kurbeyeva Victoriya">
        </div>

    </div>



</body>

</html>
